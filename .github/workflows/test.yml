name: Test

# push / PR ごとの品質ゲート（型チェック・テスト・lint・データ検証）。
# データ更新 PR（data/ のみの変更）でも validate-data が破損 JSON の混入を防ぐ。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Validate data JSONs
        run: node scripts/validate-data.mjs

      - name: Security audit
        run: npm audit --audit-level=high

