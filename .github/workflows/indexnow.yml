# IndexNow 送信（Bing / Yandex 等への早期インデックス通知）。
# 本番デプロイの後に手動実行する（キーファイルが本番に配信済みであることが前提。
# 未配信だと 403 になる。詳細は docs/data-update.md §8）。
# 送信対象は本番の sitemap.xml から収集するため、Secret は不要。
name: IndexNow Submit

on:
  workflow_dispatch:
    inputs:
      url:
        description: "特定URLのみ送信する場合に指定（空欄で sitemap.xml の全URL）"
        required: false
        default: ""

# sitemap を読んで外部 API を叩くだけなのでトークン権限は不要
permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: IndexNow 送信
        # inputs は env 経由で渡す（`${{ }}` をシェルへ直接補間するとコマンドインジェクション面になる）
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          if [[ -n "$TARGET_URL" ]]; then
            npm run indexnow -- --url="$TARGET_URL"
          else
            npm run indexnow
          fi
