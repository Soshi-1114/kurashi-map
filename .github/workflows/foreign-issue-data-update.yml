name: Foreign resident and education source updates
on:
  schedule:
    - cron: '20 20 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foreign-issue-data-update
  cancel-in-progress: false
jobs:
  inspect:
    outputs:
      pending: ${{ steps.pending.outputs.count }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Skip while an update PR is open
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "count=$(gh pr list --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("data/foreign-issue-update"))] | length')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.pending.outputs.count == '0'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.pending.outputs.count == '0'
      - name: Detect revisions, validate and prepare candidate
        if: steps.pending.outputs.count == '0'
        run: node scripts/check-foreign-issue-updates.mjs --apply
      - name: Package only reviewable outputs
        if: steps.pending.outputs.count == '0'
        run: |
          mkdir -p /tmp/foreign-update
          git diff --binary -- public/foreign-resident-issues docs/data-updates/foreign-resident-issues.json > /tmp/foreign-update/changes.patch
          git ls-files --others --exclude-standard -- public/foreign-resident-issues docs/data-updates/foreign-resident-issues.json | while IFS= read -r file; do
            git diff --no-index --binary -- /dev/null "$file" >> /tmp/foreign-update/changes.patch || test "$?" = 1
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.pending.outputs.count == '0'
        with:
          name: foreign-issue-update
          path: /tmp/foreign-update/changes.patch
          retention-days: 3
  open-pr:
    needs: inspect
    if: needs.inspect.outputs.pending == '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: foreign-issue-update
          path: /tmp/foreign-update
      - name: Create one draft PR when sources changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: data/foreign-issue-update-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -s /tmp/foreign-update/changes.patch || exit 0
          git apply --check /tmp/foreign-update/changes.patch
          git apply /tmp/foreign-update/changes.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$UPDATE_BRANCH"
          git add public/foreign-resident-issues docs/data-updates/foreign-resident-issues.json
          git commit -m 'chore(data): foreign resident and education source revisions'
          git push origin "HEAD:refs/heads/$UPDATE_BRANCH"
          gh pr create --draft --base main --head "$UPDATE_BRANCH" --title '公的原典の更新検知：外国人住民・教育環境' --body '週次の公的原典照合で検出した更新です。変更レポートと観測値・対象年度・出典を確認してください。新年度や自治体資料は手動確認が必要です。自動マージ・本番デプロイは行いません。'
